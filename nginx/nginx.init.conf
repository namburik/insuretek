# Bootstrap config — HTTP only, used during first-time cert setup
# nginx starts with this so certbot can complete the ACME challenge
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
