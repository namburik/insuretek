<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .box-domain { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
    .box-control { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
    .label { fill: #1e1b4b; font-size: 15px; font-weight: 600; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .tier-label { fill: #94a3b8; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    @media (prefers-color-scheme: dark) {
      svg { background: #0b1020; }
      .box { fill: #1e2246; stroke: #818cf8; }
      .box-domain { fill: #0f2e24; stroke: #34d399; }
      .box-control { fill: #3a2410; stroke: #fb923c; }
      .label { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .arrow { stroke: #475569; }
      .tier-label { fill: #64748b; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="330" y="10" width="240" height="50" rx="8" class="box" />
  <text x="450" y="34" class="label" text-anchor="middle">web_gateway</text>
  <text x="450" y="50" class="sub" text-anchor="middle">routes, React frontend</text>

  <rect x="140" y="90" width="230" height="50" rx="8" class="box" />
  <text x="255" y="114" class="label" text-anchor="middle">bff_service</text>
  <text x="255" y="130" class="sub" text-anchor="middle">conversational session, validation</text>

  <rect x="530" y="90" width="230" height="50" rx="8" class="box" />
  <text x="645" y="114" class="label" text-anchor="middle">workflow_engine</text>
  <text x="645" y="130" class="sub" text-anchor="middle">state machine, orchestration</text>

  <rect x="140" y="170" width="230" height="50" rx="8" class="box" />
  <text x="255" y="194" class="label" text-anchor="middle">mcp_server</text>
  <text x="255" y="210" class="sub" text-anchor="middle">exposes data tools to agents</text>

  <rect x="530" y="170" width="230" height="50" rx="8" class="box" />
  <text x="645" y="194" class="label" text-anchor="middle">core_data</text>
  <text x="645" y="210" class="sub" text-anchor="middle">repositories, DB models, audit</text>

  <rect x="330" y="250" width="240" height="50" rx="8" class="box-domain" />
  <text x="450" y="274" class="label" text-anchor="middle">insuretek</text>
  <text x="450" y="290" class="sub" text-anchor="middle">implements DomainPolicyProvider</text>

  <rect x="330" y="330" width="240" height="50" rx="8" class="box-control" />
  <text x="450" y="354" class="label" text-anchor="middle">mltek</text>
  <text x="450" y="370" class="sub" text-anchor="middle">policies, routing, agent execution</text>

  <!-- web_gateway -> bff_service / workflow_engine -->
  <path d="M400,60 L300,90" class="arrow" />
  <path d="M500,60 L600,90" class="arrow" />

  <!-- bff_service / workflow_engine -> mcp_server / core_data -->
  <path d="M255,140 L255,170" class="arrow" />
  <path d="M600,140 L670,170" class="arrow" />
  <path d="M300,140 L645,170" class="arrow" />
  <path d="M645,140 L255,170" class="arrow" />

  <!-- mcp_server / core_data -> insuretek -->
  <path d="M300,220 L400,250" class="arrow" />
  <path d="M600,220 L500,250" class="arrow" />

  <!-- insuretek -> mltek -->
  <path d="M450,300 L450,330" class="arrow" />

  <text x="450" y="430" class="sub" text-anchor="middle">Arrows show import direction (caller → callee). mltek never imports insuretek.</text>

  <text x="20" y="28" class="tier-label">HTTP LAYER</text>
  <text x="20" y="108" class="tier-label">INTAKE / WORKFLOW</text>
  <text x="20" y="188" class="tier-label">TOOLS / DATA ACCESS</text>
  <text x="20" y="268" class="tier-label">DOMAIN LAYER</text>
  <text x="20" y="348" class="tier-label">CONTROL LAYER</text>
</svg>
